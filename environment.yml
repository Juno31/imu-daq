# conda env create -f environment.yml   (creates the "daq" environment)
name: daq
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - pyserial>=3.5
  # calibration jig generator (hardware/jig/imu_jig.py)
  - cadquery>=2.4
  - matplotlib>=3.7
  - pip
  - pip:
      - nidaqmx>=1.0
      - manifold3d>=2.4
